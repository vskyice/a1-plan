<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A1戶 隔間＋擺家具工具</title>
<style>
  :root{
    --paper:#F6F8F7; --panel:#FFF; --ink:#1C2B33; --soft:#4A5B62;
    --accent:#14586A; --accent-soft:#E3EEF0; --line:#CBD5D2;
    --new:#A8731E; --fixed:#A8422F; --ok:#2E7D5B;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--paper);color:var(--ink);
    font-family:"Noto Sans TC","Microsoft JhengHei",sans-serif;-webkit-text-size-adjust:100%}
  header{padding:10px 14px 6px}
  header .eyebrow{font-size:11px;letter-spacing:.15em;color:var(--accent);font-weight:700}
  header h1{font-size:18px;margin:2px 0 4px;font-family:"Noto Serif TC","PMingLiU",serif}
  header p{font-size:12.5px;color:var(--soft);margin:0;line-height:1.6}
  .bar{display:flex;flex-wrap:wrap;gap:6px;padding:8px 14px;align-items:center}
  .bar select,.bar button,.bar input{
    font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:8px;
    background:var(--panel);color:var(--ink);font-family:inherit;
  }
  .bar button{cursor:pointer;font-weight:600}
  .bar button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
  .bar button.warn{color:var(--fixed)}
  .bar .grow{flex:1}
  .modes{display:flex;gap:0;padding:8px 14px 2px}
  .modes button{flex:1;font-size:15px;font-weight:700;padding:10px;border:1px solid var(--line);
    background:var(--panel);color:var(--soft);cursor:pointer}
  .modes button:first-child{border-radius:10px 0 0 10px}
  .modes button:last-child{border-radius:0 10px 10px 0;border-left:0}
  .modes button.on{background:var(--accent);color:#fff;border-color:var(--accent)}
  #dims{padding:6px 14px;font-size:12.5px;line-height:1.9;background:var(--panel);
    border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
  #dims .chain{font-family:Consolas,monospace;font-size:13px}
  #dims .k{color:var(--accent);font-weight:700}
  #dims .d{color:var(--soft)}
  #warn{padding:0 14px;font-size:13px;line-height:1.7}
  #warn .e{color:var(--fixed);font-weight:600}
  #warn .w{color:var(--new)}
  #warn .g{color:var(--ok)}
  #stage{overflow:auto;border-top:1px solid var(--line);border-bottom:1px solid var(--line);
    background:#EDF1EF;max-height:62vh;position:relative}
  svg{display:block;margin:0 auto}
  svg .furn{touch-action:none;cursor:grab}
  svg .wall{touch-action:none;cursor:ew-resize}
  svg .wall.vert{cursor:ew-resize} svg .wall.horiz{cursor:ns-resize}
  svg .furn.sel rect.body{stroke:#14586A;stroke-width:4}
  svg .wall.sel rect.body{stroke:#A8731E;stroke-width:5}
  svg .dim{pointer-events:none}
  svg text{pointer-events:none;user-select:none}
  #info{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center;padding:8px 14px;
    font-size:13.5px;background:var(--panel);border-bottom:1px solid var(--line);min-height:46px}
  #info b{color:var(--accent)}
  #info input[type=number]{width:78px;font-size:15px;padding:6px;border:1px solid var(--line);border-radius:6px}
  #info button{font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:6px;background:#fff;cursor:pointer}
  #info button.step{font-weight:700;min-width:46px}
  #info button.del{color:var(--fixed);border-color:#E0BFB6}
  .hint{padding:8px 14px 4px;font-size:12.5px;color:var(--soft);line-height:1.7}
  .io{padding:8px 14px 30px}
  .io textarea{width:100%;height:90px;font-size:11px;font-family:Consolas,monospace;
    border:1px solid var(--line);border-radius:8px;padding:8px;background:#fff}
  .io .row{display:flex;gap:8px;margin:8px 0;flex-wrap:wrap}
  .io button{font-size:14px;padding:8px 14px;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;font-weight:600}
  .io button.primary{background:var(--new);color:#fff;border-color:var(--new)}
  #toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;
    padding:10px 18px;border-radius:20px;font-size:14px;opacity:0;transition:opacity .3s;pointer-events:none;z-index:9}
</style>
</head>
<body>
<header>
  <div class="eyebrow">原森 TWIN TOWERS · A1戶 · DWG實測 1:1</div>
  <h1>隔間＋擺家具工具 🧱🛋️</h1>
  <p><b>紅色＝不可變更</b>（外牆、結構、浴廁、廚房、管道間、陽台）。<b>橘色＝可調輕隔間</b>，切到「移隔間」就能拖。切到「擺家具」再排家具，壓到牆的家具會變紅框。</p>
</header>

<div class="modes">
  <button id="modeWall" class="on">🧱 移隔間</button>
  <button id="modeFurn">🛋️ 擺家具</button>
</div>

<div id="dims"></div>
<div id="warn"></div>
<div id="info"></div>

<div class="bar" id="furnBar" style="display:none">
  <select id="palette"></select>
  <button class="primary" id="addBtn">＋ 新增家具</button>
  <span class="grow"></span>
  <button id="zoomOut">－</button>
  <button id="zoomIn">＋</button>
</div>
<div class="bar" id="wallBar">
  <select id="wallPick"></select>
  <span class="grow"></span>
  <button id="zoomOut2">－</button>
  <button id="zoomIn2">＋</button>
</div>

<div id="stage"><svg id="svg"></svg></div>

<div class="hint">
  💡 手機：先在上方下拉選單挑一道牆，再用 <b>−／＋</b> 或直接輸入公分數；也可以直接用手指拖橘色牆。數字單位＝公分。自動儲存於此裝置。
</div>

<div class="bar">
  <button id="presetOrig">↺ 原始格局</button>
  <button id="preset4195">主臥419.5案</button>
  <button id="resetB">載入方案B家具</button>
  <button class="warn" id="clearAll">清空家具</button>
</div>

<div class="io">
  <div class="row">
    <button class="primary" id="exportBtn">⬇ 匯出配置</button>
    <button id="copyBtn">📋 複製</button>
    <button id="importBtn">⬆ 匯入檔案</button>
    <button id="pasteImport">貼上匯入</button>
    <input type="file" id="importFile" accept=".json" style="display:none">
  </div>
  <textarea id="ioText" placeholder="匯出的內容會出現在這裡，把它整段複製給我，我照這份改 3D 模型。"></textarea>
</div>

<div id="toast"></div>

<script>
'use strict';
const PLAN = { minX:-90, maxX:1320, minY:-165, maxY:1075 };
const H = PLAN.maxY;           // svg y = H - planY
const svg = document.getElementById('svg');
const NS = 'http://www.w3.org/2000/svg';
let zoom = 1;

function el(tag, attrs, parent){
  const e = document.createElementNS(NS, tag);
  for(const k in attrs) e.setAttribute(k, attrs[k]);
  if(parent) parent.appendChild(e);
  return e;
}
function R(x1,y1,x2,y2,fill,parent,extra){
  const a = Object.assign({x:Math.min(x1,x2), y:H-Math.max(y1,y2),
    width:Math.abs(x2-x1), height:Math.abs(y2-y1), fill:fill}, extra||{});
  return el('rect', a, parent);
}
function T(x,y,s,size,fill,parent,anchor){
  const t = el('text',{x:x, y:H-y, 'font-size':size||26, fill:fill||'#8A9A94',
    'text-anchor':anchor||'middle', 'dominant-baseline':'middle'}, parent);
  t.textContent = s; return t;
}

/* ================= 可調參數（全部是「軸線」座標，cm） ================= */
const ORIG   = {wA:372,   wB:672, wC:932, d2:406.5, d3:376.5, wNW:352};
const P4195  = {wA:412,   wB:672, wC:932, d2:406.5, d3:376.5, wNW:352};
let P = Object.assign({}, ORIG);

const WDEF = {
  wA :{label:'主臥／房2 隔間',      dir:'x', lo:180, hi:640,  note:'往東移＝主臥變大、房2變小'},
  wB :{label:'房2／房3 隔間',       dir:'x', lo:300, hi:900,  note:'兩間小孩房的分界'},
  wC :{label:'房3／客餐廳 隔間',    dir:'x', lo:500, hi:1150, note:'往東移＝房3變大、客餐廳變小'},
  d2 :{label:'房2 北牆（進深）',    dir:'y', lo:220, hi:436,  note:'往北推＝房2變深、走道變窄'},
  d3 :{label:'房3 北牆（進深）',    dir:'y', lo:220, hi:436,  note:'往北推＝房3變深、走道變窄'},
  wNW:{label:'西北房（女兒房）東牆', dir:'x', lo:180, hi:352,  note:'只能往西縮；讓出來的是儲藏帶。東側客浴A不可變更'}
};
const WORDER = ['wA','wB','wC','d2','d3','wNW'];

/* 南向外牆的實牆段與窗（判斷隔間牆能不能落腳） */
const SOLID = [[85,167],[289,430],[610,700],[880,1019],[1140,1146],[1236,1308.5]];
const WIN   = [[167,289],[430,610],[700,880],[1019,1140]];

function clampAll(){
  const c=(k,lo,hi)=>{ P[k] = Math.max(lo, Math.min(hi, P[k])); };
  c('wA', WDEF.wA.lo, Math.min(WDEF.wA.hi, P.wB-160));
  c('wB', Math.max(WDEF.wB.lo, P.wA+160), Math.min(WDEF.wB.hi, P.wC-160));
  c('wC', Math.max(WDEF.wC.lo, P.wB+160), WDEF.wC.hi);
  c('d2', WDEF.d2.lo, WDEF.d2.hi);
  c('d3', WDEF.d3.lo, WDEF.d3.hi);
  c('wNW', WDEF.wNW.lo, WDEF.wNW.hi);
}

/* 由參數算出可調隔間的牆體矩形（含門洞） */
function movableWalls(){
  const p = P;
  return [
    {id:'wA',  rects:[[p.wA-5, 15,       p.wA+5,  p.d2-5]]},
    {id:'wB',  rects:[[p.wB-5, 15,       p.wB+5,  p.d3-5]]},
    {id:'wC',  rects:[[p.wC-5, 15,       p.wC+5,  p.d3-5]]},
    {id:'d2',  rects:[[p.wA+5, p.d2-5,   p.wB-100, p.d2+5],
                      [p.wB-20, p.d2-5,  p.wB-5,   p.d2+5]]},   // 門洞 80cm 靠東
    {id:'d3',  rects:[[p.wB+5, p.d3-5,   p.wB+20, p.d3+5],
                      [p.wB+100, p.d3-5, p.wC+5,  p.d3+5]]},   // 門洞 80cm 靠西
    {id:'wNW', rects:[[p.wNW-5, 650, p.wNW+5, 840]]}
  ];
}

/* 房間淨尺寸 */
function rooms(){
  const p = P;
  return {
    主臥:   {x1:0,        x2:p.wA-5,   y1:15, y2:368.5},
    房2:    {x1:p.wA+5,   x2:p.wB-5,   y1:15, y2:p.d2-5},
    房3:    {x1:p.wB+5,   x2:p.wC-5,   y1:15, y2:p.d3-5},
    客餐廳: {x1:p.wC+5,   x2:1293.5,   y1:15, y2:885},
    西北房: {x1:-63,      x2:p.wNW-5,  y1:541, y2:840}
  };
}

/* ================= 固定圖層（不可變更） ================= */
const gStatic = el('g',{});
const WALL='#7A8388', PART='#9AA5A8', GLASS='#BFD8E2', FIX='#C9CFD1', BAL='#E3E8E6';

function drawStatic(){
  gStatic.innerHTML = '';
  R(0,0,1308.5,885,'#FAFAF8',gStatic);
  R(342,900,698,1057.5,BAL,gStatic);            // 工作陽台
  R(922,-152.5,1308.5,0,BAL,gStatic);           // 主陽台
  R(85,-45,837,0,'#EEF1EF',gStatic);            // 花台
  R(-25,855,85,970,'#EEF1EF',gStatic);          // 冷氣平台

  // 南向外牆＋窗
  SOLID.forEach(s=>R(s[0],0,s[1],15,WALL,gStatic));
  WIN.forEach(s=>R(s[0],3,s[1],12,GLASS,gStatic));
  R(1146,3,1236,12,'#D8ECF2',gStatic);          // 陽台落地門
  // 西牆：主臥（含西窗）
  R(-15,15,0,254,WALL,gStatic); R(-15,254,0,304,GLASS,gStatic); R(-15,304,0,368.5,WALL,gStatic);
  R(-78,363.5,0,378.5,WALL,gStatic); R(-78,531.5,0,546.5,WALL,gStatic);
  R(-78,363.5,-63,384,WALL,gStatic); R(-78,462,-63,546.5,WALL,gStatic);
  R(-75,384,-67,462,GLASS,gStatic);
  R(-78,546.5,-63,596,WALL,gStatic); R(-78,746.5,-63,830,WALL,gStatic);
  R(-75,596,-67,746,GLASS,gStatic);
  R(-78,830,-15,845,WALL,gStatic);
  R(-15,840,292,855,WALL,gStatic); R(292,840,342,960,WALL,gStatic);
  R(342,885,590,900,WALL,gStatic); R(670,885,728.5,900,WALL,gStatic);
  R(728.5,820,917,835,WALL,gStatic); R(738.5,835,912,885,'#EDF1EF',gStatic);
  R(925,885,1170,900,WALL,gStatic); R(1270,885,1308.5,900,WALL,gStatic);
  R(1055,845,1170,885,WALL,gStatic);
  R(342,900,357,1057.5,WALL,gStatic); R(683,900,698,1057.5,WALL,gStatic);
  R(357,1042.5,683,1057.5,WALL,gStatic); R(360,1044,680,1051,GLASS,gStatic);
  R(1293.5,15,1308.5,885,WALL,gStatic); R(1293.5,-128,1308.5,15,WALL,gStatic);
  R(-15,-110,85,15,WALL,gStatic); R(837,-125,937,15,WALL,gStatic);

  // 管道間（不可變更）
  [[150,541,215,645],[435,541,540,605],[1125,690,1185,790],[738.5,714.5,775.5,820]].forEach(p=>{
    R(p[0],p[1],p[2],p[3],'#B9552F',gStatic,{opacity:.75});
  });

  // 固定隔間（浴廚、走道北牆、玄關等，皆不可調）
  const fixedParts = [
   [0,368.5,247,378.5],[237,458,247,531.5],
   [0,531,417,541],
   [502,531,562,541],[672,531,728.5,541],
   [502,541,512,885],[728.5,541,738.5,820],
   [738.5,704.5,917,714.5],[775.5,714.5,785.5,820],
   [912,714.5,925,730],[912,810,925,900],
   [342,840,357,900],
   [347,650,357,840],                                  // 客浴A 西牆（固定，不隨女兒房東牆走）
   [357,650,377,660],[447,650,502,660],[357,795,502,805],
   [925,705,1035,715],[1115,705,1125,715],[1115,715,1125,885]
  ];
  fixedParts.forEach(p=>R(p[0],p[1],p[2],p[3],PART,gStatic));

  // 固定設備
  const fixt = [
   ['浴缸',-63,388,82,528],['馬桶',102,472,142,512],['面盆',180,466,232,528],
   ['馬桶',442,740,482,780],['面盆',372,670,412,728],['淋浴',372,795,452,880],
   ['馬桶',1041,735,1081,775],['面盆',945,840,1035,880],['淋浴間',785.5,714.5,912,820],
   ['廚具',512,545,572,820]
  ];
  fixt.forEach(f=>{
    R(f[1],f[2],f[3],f[4],FIX,gStatic,{stroke:'#AEB6B8','stroke-width':1.5});
    T((f[1]+f[3])/2,(f[2]+f[4])/2,f[0],20,'#7A8388',gStatic);
  });

  // 固定區域標籤
  [['客廳',1110,480],['餐廳',1000,600],['廚房',630,650],['客浴A',430,630],['客浴B',1028,660],
   ['玄關',1215,800],['主浴',150,350],['工作陽台',520,985],['主陽台',1110,-80],
   ['冷氣平台',30,912],['家事區',430,845],['門斗',826,858]
  ].forEach(l=>T(l[1],l[2],l[0],28,'#9FB0AA',gStatic));
}

/* 障礙物清單（判斷家具有沒有壓到東西） */
function obstacles(){
  const list = [
   [-15,15,0,368.5],[1293.5,15,1308.5,885],[-15,-110,85,15],[837,-125,937,15],
   [0,368.5,247,378.5],[237,458,247,531.5],[0,531,417,541],
   [502,531,562,541],[672,531,728.5,541],[502,541,512,885],[728.5,541,738.5,820],
   [738.5,704.5,917,714.5],[775.5,714.5,785.5,820],[912,714.5,925,730],[912,810,925,900],
   [342,840,357,900],[347,650,357,840],
   [357,650,377,660],[447,650,502,660],[357,795,502,805],
   [925,705,1035,715],[1115,705,1125,715],[1115,715,1125,885],
   [150,541,215,645],[435,541,540,605],[1125,690,1185,790],[738.5,714.5,775.5,820],
   [-63,388,82,528],[102,472,142,512],[180,466,232,528],
   [442,740,482,780],[372,670,412,728],[372,795,452,880],
   [1041,735,1081,775],[945,840,1035,880],[785.5,714.5,912,820],[512,545,572,820]
  ];
  movableWalls().forEach(w=>w.rects.forEach(r=>list.push(r)));
  return list;
}

/* ================= 可調隔間圖層 ================= */
const gWall = el('g',{});
const gRoom = el('g',{});
let selWall = null, mode = 'wall';

function drawWalls(){
  gWall.innerHTML = '';
  movableWalls().forEach(w=>{
    const def = WDEF[w.id];
    const g = el('g',{class:'wall '+(def.dir==='x'?'vert':'horiz')+(selWall===w.id?' sel':''),'data-wid':w.id}, gWall);
    w.rects.forEach(r=>R(r[0],r[1],r[2],r[3],'#D9A85C',g,{class:'body',stroke:'#A8731E','stroke-width':2}));
    // 加寬觸控熱區
    const xs = w.rects.map(r=>[r[0],r[2]]).flat(), ys = w.rects.map(r=>[r[1],r[3]]).flat();
    const x1=Math.min(...xs), x2=Math.max(...xs), y1=Math.min(...ys), y2=Math.max(...ys);
    if(def.dir==='x') R((x1+x2)/2-28,y1,(x1+x2)/2+28,y2,'transparent',g,{});
    else              R(x1,(y1+y2)/2-28,x2,(y1+y2)/2+28,'transparent',g,{});
    if(mode==='wall') g.addEventListener('pointerdown', startWallDrag);
    g.style.pointerEvents = (mode==='wall') ? 'auto' : 'none';
  });
}

function drawRooms(){
  gRoom.innerHTML = '';
  const rm = rooms();
  const put = (name,r,extra)=>{
    const cx=(r.x1+r.x2)/2, cy=(r.y1+r.y2)/2;
    T(cx, cy+22, name, 30, '#8FA39C', gRoom);
    T(cx, cy-16, `${Math.round((r.x2-r.x1)*10)/10} × ${Math.round((r.y2-r.y1)*10)/10}`, 24, '#A9B7B1', gRoom);
    if(extra) T(cx, cy-48, extra, 21, '#B7C2BC', gRoom);
  };
  put('主臥', rm.主臥);
  put('房2', rm.房2);
  put('房3', rm.房3);
  put('西北房（女兒房）', rm.西北房);
  // 走道剩餘寬度
  const c2 = 531-(P.d2+5), c3 = 531-(P.d3+5);
  T((P.wA+P.wB)/2, P.d2+5+c2/2, `走道 ${Math.round(c2*10)/10}`, 22, '#A9B7B1', gRoom);
  T((P.wB+P.wC)/2, P.d3+5+c3/2, `走道 ${Math.round(c3*10)/10}`, 22, '#A9B7B1', gRoom);
  // 女兒房東側讓出的儲藏帶
  if(P.wNW < 345){
    R(P.wNW+5, 650, 347, 840, '#EFE6D2', gRoom, {stroke:'#C7B183','stroke-dasharray':'10 6','stroke-width':2});
    T((P.wNW+352)/2, 745, `儲藏帶 ${Math.round((347-P.wNW-5)*10)/10}`, 20, '#A08A5C', gRoom);
  }
}

/* ================= 尺寸鏈與檢核 ================= */
function updateDims(){
  const a = P.wA+7.5, b = P.wB-P.wA, c = P.wC-P.wB, d = 1301-P.wC;
  const n = v=>Math.round(v*10)/10;
  const rm = rooms();
  document.getElementById('dims').innerHTML =
    `<div class="chain"><span class="k">建商軸線鏈</span>　主臥 <b>${n(a)}</b> ｜ 房2 <b>${n(b)}</b> ｜ 房3 <b>${n(c)}</b> ｜ 客餐廳 <b>${n(d)}</b> ＝ ${n(a+b+c+d)}　<span class="d">(原始 379.5 / 300 / 260 / 369)</span></div>
     <div class="d">淨寬　主臥 ${n(rm.主臥.x2-rm.主臥.x1)}／房2 ${n(rm.房2.x2-rm.房2.x1)}／房3 ${n(rm.房3.x2-rm.房3.x1)}／客餐廳 ${n(rm.客餐廳.x2-rm.客餐廳.x1)}　·　進深 房2 ${n(rm.房2.y2-rm.房2.y1)}／房3 ${n(rm.房3.y2-rm.房3.y1)}</div>`;
}

function updateWarn(){
  const out = [];
  const n = v=>Math.round(v*10)/10;
  // 1. 垂直隔間是否壓到南向窗
  ['wA','wB','wC'].forEach(k=>{
    const lo = P[k]-5, hi = P[k]+5;
    const hit = WIN.find(w=>hi>w[0] && lo<w[1]);
    if(hit) out.push(`<span class="e">✕ ${WDEF[k].label} 落在 x ${n(lo)}–${n(hi)}，壓到南向窗（${hit[0]}–${hit[1]}），無法施作</span>`);
    else{
      const seg = SOLID.find(s=>lo>=s[0] && hi<=s[1]);
      if(seg){
        const m = Math.min(lo-seg[0], seg[1]-hi);
        if(m < 5) out.push(`<span class="w">△ ${WDEF[k].label} 距窗框只剩 ${n(m)}cm，施工幾乎沒有餘裕</span>`);
      }else{
        out.push(`<span class="w">△ ${WDEF[k].label} 未完全落在實牆段上，需現場確認收邊</span>`);
      }
    }
  });
  // 2. 房間淨寬
  const rm = rooms();
  [['主臥',rm.主臥,300],['房2',rm.房2,240],['房3',rm.房3,240]].forEach(([nm,r,min])=>{
    const w = r.x2-r.x1;
    if(w < min-30) out.push(`<span class="e">✕ ${nm} 淨寬僅 ${n(w)}cm，單人床(90)＋衣櫃(60)＋走道已排不下</span>`);
    else if(w < min) out.push(`<span class="w">△ ${nm} 淨寬 ${n(w)}cm，低於建議 ${min}cm，家具要訂製</span>`);
  });
  // 3. 走道
  [['房2側',531-(P.d2+5)],['房3側',531-(P.d3+5)]].forEach(([nm,c])=>{
    if(c < 90) out.push(`<span class="e">✕ 走道${nm}淨寬 ${n(c)}cm，低於 90cm 通行下限</span>`);
    else if(c < 100) out.push(`<span class="w">△ 走道${nm}淨寬 ${n(c)}cm，兩人交會會擠</span>`);
  });
  // 4. 家具壓牆
  const obs = obstacles();
  let bad = 0;
  items.forEach(it=>{
    it._bad = obs.some(o=>it.x < o[2] && it.x+it.w > o[0] && it.y < o[3] && it.y+it.d > o[1]);
    if(it._bad) bad++;
  });
  if(bad) out.push(`<span class="w">△ 有 ${bad} 件家具壓到牆體或設備（紅框），切到「擺家具」調整</span>`);
  if(!out.length) out.push('<span class="g">✓ 目前配置沒有牴觸項目</span>');
  document.getElementById('warn').innerHTML = out.join('<br>');
}

const LIB = [

 ['單人床(加大)',552,212,105,188,0],['書桌 120',400,30,120,60,0],['衣櫃 180',382,220,60,180,90],
 ['單人床(加大)',812,182,105,188,0],['書桌 120',755,30,120,60,0],['衣櫃 150',682,95,60,150,90],
 ['餐桌 240×100',880,320,240,100,0],['沙發 220',945,90,95,220,90],['茶几',1075,160,80,80,0],
 ['電視櫃',1250,110,42,200,90],['高櫃(深45)',935,660,180,45,0],['鞋櫃(深40)',1255,710,35,150,90],

let items = [];

const palette = document.getElementById('palette');
LIB.forEach((f,i)=>{

const wallPick = document.getElementById('wallPick');
WORDER.forEach(k=>{

wallPick.onchange = ()=>{ selWall = wallPick.value; drawWalls(); updateInfo(); };

function toast(m){
  const t = document.getElementById('toast');
  t.textContent = m; t.style.opacity = 1;
  clearTimeout(t._h); t._h = setTimeout(()=>t.style.opacity=0, 1800);
}
function save(){ localStorage.setItem('a1_layout_v2', JSON.stringify({walls:P, items})); }
function load(){
  try{
    const s = localStorage.getItem('a1_layout_v2');
    if(s){
      const j = JSON.parse(s);
      if(j.walls) P = Object.assign({}, ORIG, j.walls);
      if(j.items){ items = j.items; seq = Math.max(0,...items.map(i=>i.id||0))+1; return; }
    }
  }catch(e){}
  loadDefault();
}
function loadDefault(){
  seq = 1;
  items = DEFAULT_B.map(d=>({id:seq++, name:d[0], x:d[1], y:d[2], w:d[3], d:d[4], rot:d[5]||0}));
}

function renderFurn(){
  gFurn.innerHTML = '';
  items.forEach(it=>{
    const g = el('g',{class:'furn'+(it.id===selId?' sel':''),'data-id':it.id},gFurn);
    R(it.x,it.y,it.x+it.w,it.y+it.d, it._bad?'#F3D9D3':'#E9D9BC', g,
      {class:'body',stroke:it._bad?'#A8422F':'#B08A4F','stroke-width':2,rx:3});
    T(it.x+it.w/2, it.y+it.d/2+14, it.name, 22, '#6B5228', g);
    T(it.x+it.w/2, it.y+it.d/2-16, `${it.w}×${it.d}`, 20, '#8A6F3F', g);
    if(mode==='furn') g.addEventListener('pointerdown', startDrag);
    g.style.pointerEvents = (mode==='furn') ? 'auto' : 'none';
    g.style.opacity = (mode==='furn') ? 1 : .45;
  });
}

function render(){
  clampAll();
  drawWalls(); drawRooms();
  updateDims();
  updateWarn();      // 會設定 it._bad
  renderFurn();
  updateInfo(); save();
}

function updateInfo(){
  const box = document.getElementById('info');
  if(mode === 'wall'){
    const k = selWall;
    if(!k){ box.innerHTML = '<span style="color:var(--soft)">點一下橘色的牆，或用上方下拉選單挑一道牆</span>'; return; }
    const def = WDEF[k];
    box.innerHTML = `<b>${def.label}</b>
      ${def.dir==='x'?'軸線 X':'軸線 Y'}
      <button class="step" id="wm">−5</button>
      <input type="number" id="wv" step="0.5" value="${Math.round(P[k]*10)/10}">
      <button class="step" id="wp">＋5</button> cm
      <span style="color:var(--soft);font-size:12.5px">${def.note}</span>`;
    document.getElementById('wv').onchange = e=>{ P[k] = +e.target.value || P[k]; render(); };
    document.getElementById('wm').onclick = ()=>{ P[k] -= 5; render(); };
    document.getElementById('wp').onclick = ()=>{ P[k] += 5; render(); };
  }else{
    const it = items.find(i=>i.id===selId);
    if(!it){ box.innerHTML = '<span style="color:var(--soft)">尚未選取家具——點一下任何家具即可編輯</span>'; return; }
    box.innerHTML = `<b>${it.name}</b>
      寬 <input type="number" id="iw" value="${it.w}" min="10" max="400"> ×
      深 <input type="number" id="id_" value="${it.d}" min="10" max="400"> cm
      <button id="rotB">↻ 旋轉</button><button id="dupB">⧉ 複製</button><button class="del" id="delB">🗑 刪除</button>`;
    document.getElementById('iw').onchange = e=>{ it.w = +e.target.value||it.w; render(); };
    document.getElementById('id_').onchange = e=>{ it.d = +e.target.value||it.d; render(); };
    document.getElementById('rotB').onclick = ()=>{ const w=it.w; it.w=it.d; it.d=w; it.rot=(it.rot+90)%360; render(); };
    document.getElementById('dupB').onclick = ()=>{
      items.push(Object.assign({}, it, {id:seq++, x:it.x+30, y:it.y-30})); selId = seq-1; render();
    };
    document.getElementById('delB').onclick = ()=>{ items = items.filter(i=>i.id!==it.id); selId=null; render(); };
  }
}

/* ================= 拖曳 ================= */
let drag = null, wdrag = null;
function svgPoint(ev){
  const pt = svg.createSVGPoint(); pt.x = ev.clientX; pt.y = ev.clientY;
  const p = pt.matrixTransform(svg.getScreenCTM().inverse());
  return {x:p.x, y:H-p.y};
}
function startDrag(ev){
  const id = +ev.currentTarget.getAttribute('data-id');
  const it = items.find(i=>i.id===id);
  if(selId !== id){ selId = id; render(); }
  const g = gFurn.querySelector(`g[data-id="${id}"]`);
  const p = svgPoint(ev);
  drag = {it, g, x0:it.x, y0:it.y, px:p.x, py:p.y};
  try{ g.setPointerCapture(ev.pointerId); }catch(e){}
  ev.preventDefault();
}
function startWallDrag(ev){
  const wid = ev.currentTarget.getAttribute('data-wid');
  selWall = wid; wallPick.value = wid;
  const p = svgPoint(ev);
  wdrag = {wid, v0:P[wid], px:p.x, py:p.y, dir:WDEF[wid].dir};
  try{ ev.currentTarget.setPointerCapture(ev.pointerId); }catch(e){}
  drawWalls(); updateInfo();
  ev.preventDefault();
}
svg.addEventListener('pointermove', ev=>{
  if(wdrag){
    const p = svgPoint(ev);
    const raw = wdrag.dir==='x' ? wdrag.v0 + p.x - wdrag.px : wdrag.v0 + p.y - wdrag.py;
    P[wdrag.wid] = Math.round(raw/2.5)*2.5;
    render();
    return;
  }
  if(!drag) return;
  const p = svgPoint(ev);
  const nx = Math.round((drag.x0 + p.x - drag.px)/5)*5;
  const ny = Math.round((drag.y0 + p.y - drag.py)/5)*5;
  drag.it.x = nx; drag.it.y = ny;
  drag.g.setAttribute('transform', `translate(${nx-drag.x0},${-(ny-drag.y0)})`);
});
function endDrag(){ if(wdrag){ wdrag=null; render(); } if(drag){ drag=null; render(); } }
svg.addEventListener('pointerup', endDrag);
svg.addEventListener('pointercancel', endDrag);
svg.addEventListener('pointerdown', ev=>{
  if(ev.target === svg || ev.target.parentNode === gStatic){
    if(mode==='furn'){ selId = null; render(); }
  }
});

/* ================= 模式切換 ================= */
function setMode(m){
  mode = m;
  document.getElementById('modeWall').className = m==='wall'?'on':'';
  document.getElementById('modeFurn').className = m==='furn'?'on':'';
  document.getElementById('wallBar').style.display = m==='wall'?'flex':'none';
  document.getElementById('furnBar').style.display = m==='furn'?'flex':'none';
  render();
}
document.getElementById('modeWall').onclick = ()=>setMode('wall');
document.getElementById('modeFurn').onclick = ()=>setMode('furn');

/* ================= 縮放 ================= */
function fit(){
  const W = PLAN.maxX-PLAN.minX, Hh = PLAN.maxY-PLAN.minY;
  svg.setAttribute('viewBox', `${PLAN.minX} 0 ${W} ${Hh}`);
  const base = Math.min(document.getElementById('stage').clientWidth || 800, 1100);
  svg.setAttribute('width', base*zoom);
  svg.setAttribute('height', base*zoom*Hh/W);
}
const zi = ()=>{ zoom = Math.min(zoom*1.25, 4); fit(); };
const zo = ()=>{ zoom = Math.max(zoom/1.25, .6); fit(); };
document.getElementById('zoomIn').onclick = zi;  document.getElementById('zoomOut').onclick = zo;
document.getElementById('zoomIn2').onclick = zi; document.getElementById('zoomOut2').onclick = zo;
window.addEventListener('resize', fit);

  }
};
document.getElementById('resetB').onclick = ()=>{

};
document.getElementById('clearAll').onclick = ()=>{
  if(confirm('確定清空全部家具？')){ items=[]; selId=null; render(); }
};

/* ================= 匯出／匯入 ================= */
function exportData(){
  const n = v=>Math.round(v*10)/10;
  const rm = rooms();
  return JSON.stringify({
    version:'a1-layout-2', unit:'cm', origin:'室內西南角，Y向北',
    date:new Date().toISOString().slice(0,10),
    walls: P,
    chain_axis: {主臥:n(P.wA+7.5), 房2:n(P.wB-P.wA), 房3:n(P.wC-P.wB), 客餐廳:n(1301-P.wC)},
    clear: {主臥:n(rm.主臥.x2-rm.主臥.x1), 房2:n(rm.房2.x2-rm.房2.x1),
            房3:n(rm.房3.x2-rm.房3.x1), 客餐廳:n(rm.客餐廳.x2-rm.客餐廳.x1),
            走道_房2側:n(531-(P.d2+5)), 走道_房3側:n(531-(P.d3+5))},
    items: items.map(({id,_bad,...r})=>r)
  }, null, 1);
}
document.getElementById('exportBtn').onclick = ()=>{
  const data = exportData();
  document.getElementById('ioText').value = data;
  const blob = new Blob([data], {type:'application/json'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = 'A1隔間家具配置.json'; a.click();
  toast('已下載 A1隔間家具配置.json，傳給 Claude 即可');
};
document.getElementById('copyBtn').onclick = async ()=>{
  const data = exportData();
  document.getElementById('ioText').value = data;
  try{ await navigator.clipboard.writeText(data); toast('已複製到剪貼簿'); }
  catch(e){ toast('請手動全選下方文字複製'); }
};
document.getElementById('importBtn').onclick = ()=>document.getElementById('importFile').click();
document.getElementById('importFile').onchange = ev=>{
  const f = ev.target.files[0]; if(!f) return;
  f.text().then(t=>doImport(t));
};
document.getElementById('pasteImport').onclick = ()=>doImport(document.getElementById('ioText').value);
function doImport(t){
  try{
    const j = JSON.parse(t);
    if(!j.items) throw 0;
    if(j.walls) P = Object.assign({}, ORIG, j.walls);
    seq = 1; items = j.items.map(r=>({id:seq++, rot:0, ...r}));
    selId = null; render(); toast('匯入成功');
  }catch(e){ toast('格式不對，匯入失敗'); }
}

drawStatic();
svg.appendChild(gStatic); svg.appendChild(gWall); svg.appendChild(gRoom); svg.appendChild(gFurn);
load();

setMode('wall');
fit();
